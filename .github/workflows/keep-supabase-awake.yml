# Keeps the free Supabase project from pausing after 7 days without activity.
# Runs every 3 days and makes one tiny read from the "rooms" table.
# You can also run it by hand: GitHub repo > Actions > "Keep Supabase awake" > Run workflow.

name: Keep Supabase awake

on:
  schedule:
    - cron: "17 1 */3 * *"   # 01:17 UTC (09:17 Bali time) every 3rd day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://qhyrdlaeeruyireocfbl.supabase.co
          # Same public "anon" key already used in index.html
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFoeXJkbGFlZXJ1eWlyZW9jZmJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MzExNjEsImV4cCI6MjA5MDEwNzE2MX0.QG_6ZV0p51pejAZMbX1gcKbov43jRxDthki2abMMpNs
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/rooms?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded with HTTP $code"
          if [ "$code" != "200" ]; then exit 1; fi
